name: SEO staging smoke test
on:
  push:
    branches: [seo/phase-2-prototype]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seo-staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    if: github.ref == 'refs/heads/seo/phase-2-prototype'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node seo/prototype.test.mjs
      - run: node seo/staging.test.mjs
