name: SEO staging smoke test
on:
  push:
    branches: [seo/phase-2-prototype]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seo-staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    if: github.ref == 'refs/heads/seo/phase-2-prototype'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node seo/prototype.test.mjs
      - run: node seo/staging.test.mjs
      - name: Verify the production release test page
        if: contains(github.event.head_commit.message, '[verify-release-page]')
        run: |
          curl -fsS --retry 4 --retry-all-errors --retry-delay 3 --max-time 15 https://adjuto-service.github.io/seo-release-test.html -o "$RUNNER_TEMP/seo-release-test.html"
          grep -F 'SEOシステムの公開テスト' "$RUNNER_TEMP/seo-release-test.html"
          grep -F 'name="robots" content="noindex,nofollow"' "$RUNNER_TEMP/seo-release-test.html"
          curl -fsS --max-time 15 https://adjuto-service.github.io/ -o "$RUNNER_TEMP/seo-root.html"
          grep -Fq 'ADJUTO SERVICE' "$RUNNER_TEMP/seo-root.html"
      - name: Check Gemini credential availability
        if: contains(github.event.head_commit.message, '[gemini-check]')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is missing from this workflow environment."
            exit 1
          fi
          echo "Gemini credential is configured."
